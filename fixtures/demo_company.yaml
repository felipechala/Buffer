  - {id: proc-d3, account: settlement, amount: 85000, expected_day: 3, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
  - {id: proc-d4, account: settlement, amount: 85000, expected_day: 4, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
  - {id: proc-d5, account: settlement, amount: 60000, expected_day: 5, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
  - {id: proc-d6, account: settlement, amount: 60000, expected_day: 6, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
  - {id: acme-inv-4471, account: operating, amount: 520000, expected_day: 2, counterparty: Acme Industrial (invoice 4471), correlation_key: acme, delay_distribution: {0: 0.55, 1: 0.20, 2: 0.15, 4: 0.10}}
  - {id: globex-inv-918, account: operating, amount: 180000, expected_day: 4, counterparty: Globex Retail (invoice 918), correlation_key: globex, delay_distribution: {0: 0.70, 1: 0.20, 3: 0.10}}
  - {id: eu-wholesale-q4, account: intl_clearing, amount: 140000, expected_day: 3, counterparty: EU wholesale distributor, correlation_key: eu-wholesale, delay_distribution: {0: 0.60, 1: 0.25, 2: 0.15}}

