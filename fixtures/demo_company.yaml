transfer_routes:
  - {id: sweep-settlement, from: settlement, to: operating, settlement_days: 0, max_amount: 400000, fee_rate: 0.0002, note: Daily book sweep}
  - {id: fund-payroll, from: operating, to: payroll, settlement_days: 0, max_amount: 300000, fee_rate: 0.0}
  - {id: fund-tax, from: operating, to: tax, settlement_days: 0, max_amount: 250000, fee_rate: 0.0}
  - {id: fund-intl, from: operating, to: intl_clearing, settlement_days: 1, max_amount: 200000, fee_rate: 0.0015, note: Next-day wire via FX desk}
  - {id: reserve-draw, from: reserve, to: operating, settlement_days: 1, max_amount: 300000, fee_rate: 0.0005, note: "Treasury policy (synthetic): T+1, max $300k/day"}
  - {id: reserve-to-payroll, from: reserve, to: payroll, settlement_days: 0, max_amount: 150000, fee_rate: 0.0005, allowed: false, note: "Restricted (synthetic): requires CFO sign-off"}

credit_lines:
  - id: revolver
    account: operating
    available_limit: 250000
    draw_delay_days: 1
    fee_rate: 0.0125
