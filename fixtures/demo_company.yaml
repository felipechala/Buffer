# Fictional demo company. ALL values are synthetic assumptions for software testing.
# Day 0 = Monday 2026-11-16. Amounts in USD (converted to integer cents on load).
company:
  name: Halcyon Components Inc. (fictional)
  as_of: 2026-11-16
  horizon_days: 7

assumptions:
  - "Obligations, expected receipts, route limits and credit terms are synthetic, not sourced from Nessie."
  - "Settlement calendars are simplified: every day is a business day."
  - "Receipt delay distributions are illustrative, not calibrated on historical data."

accounts:
  - id: operating
    name: Operating
    role: Main disbursement account; pays suppliers, rent and services.
    observed_balance: 380000
    min_buffer: 100000
  - id: payroll
    name: Payroll
    role: Funded from operating just before each payroll run.
    observed_balance: 40000
    min_buffer: 25000
  - id: tax
    name: Tax
    role: Segregated account for tax remittances.
    observed_balance: 60000
    min_buffer: 15000
  - id: reserve
    name: Strategic Reserve
    role: Liquidity reserve; withdrawals restricted by treasury policy.
    observed_balance: 1100000
    min_buffer: 400000
  - id: intl_clearing
    name: International Clearing
    role: Pays foreign suppliers and contractors; receives EU wholesale receipts.
    observed_balance: 120000
    min_buffer: 40000
  - id: settlement
    name: Merchant Settlement
    role: Receives daily card-processor settlements; swept to operating.
    observed_balance: 90000
    min_buffer: 20000

expected_receipts:
  - {id: proc-d0, account: settlement, amount: 85000, expected_day: 0, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
  - {id: proc-d1, account: settlement, amount: 85000, expected_day: 1, counterparty: Card processor, correlation_key: card-processor, delay_distribution: {0: 0.85, 1: 0.12, 2: 0.03}}
